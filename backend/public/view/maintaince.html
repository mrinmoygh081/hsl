<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance Mode</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: 'Inter', sans-serif;
            overflow: hidden; /* Prevents scrolling */
        }

        .container {
            /* Full screen settings */
            width: 100vw;
            height: 100vh;
            
            /* Center content */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            
            /* Styling */
            background: radial-gradient(circle at center, #ffffff 0%, #f4f7f6 100%);
            color: #333;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .icon {
            font-size: 80px; /* Slightly larger for full screen */
            margin-bottom: 24px;
        }

        .status-tag {
            display: inline-block;
            background: #e1f5fe;
            color: #0288d1;
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 1rem;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        h1 {
            font-size: clamp(2rem, 5vw, 3.5rem); /* Scales based on screen size */
            margin-bottom: 15px;
            color: #2c3e50;
            font-weight: 700;
        }

        p {
            font-size: clamp(1rem, 2vw, 1.25rem);
            line-height: 1.6;
            color: #666;
            max-width: 700px; /* Keeps text readable on wide screens */
            margin: 0 auto 40px auto;
        }

        .loader-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            background: rgba(255, 255, 255, 0.5);
            padding: 15px 30px;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
        }

        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1.5s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        strong {
            color: #2c3e50;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon">🛠️</div>
        <div class="status-tag">System Update</div>
        
        <h1>We'll be back soon!</h1>
        
        <p>
            Sorry for the inconvenience. We're currently performing some scheduled maintenance to improve our services. We should be back online shortly.
        </p>
        
        <!-- <div class="loader-wrapper">
            <div class="loader"></div>
           <span>Estimated downtime: <strong>2 Hours</strong></span> 
        </div>  -->
    </div>

</body>
</html>
